<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Vermazing Vegan Soap Gift Box</title>
    <style>
      :root {
        --bg: #faf8f3;
        --surface: #ffffff;
        --ink: #2b2b26;
        --ink-soft: #5f5f57;
        --brand: #4a7c59;
        --brand-dark: #3a6247;
        --brand-soft: #e7efe8;
        --border: #e5e0d5;
        --shadow: 0 10px 30px rgba(43, 43, 38, 0.08);
        --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: var(--font);
        color: var(--ink);
        background: var(--bg);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      img { max-width: 100%; display: block; }
      a { text-decoration: none; color: inherit; }

      .site-header {
        border-bottom: 1px solid var(--border);
        background: rgba(250, 248, 243, 0.85);
      }
      .site-header .inner {
        max-width: 960px;
        margin: 0 auto;
        padding: 0 24px;
        height: 68px;
        display: flex;
        align-items: center;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        font-size: 1.1rem;
      }
      .brand .dot {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        background: var(--brand);
        display: inline-block;
      }

      .wrap {
        max-width: 960px;
        margin: 0 auto;
        padding: 48px 24px 80px;
        text-align: center;
      }
      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 0.14em;
        font-size: 0.78rem;
        font-weight: 700;
        color: var(--brand);
        margin: 0 0 12px;
      }
      h1 {
        font-size: clamp(2rem, 5vw, 3rem);
        margin: 0 0 8px;
        letter-spacing: -0.01em;
      }
      .price {
        font-size: clamp(1.6rem, 4vw, 2.2rem);
        font-weight: 700;
        color: var(--brand-dark);
        margin: 0 0 36px;
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
        margin: 0 auto 40px;
        max-width: 720px;
      }
      .gallery figure {
        margin: 0;
        border-radius: 20px;
        overflow: hidden;
        background: var(--surface);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
      }
      .gallery img {
        width: 100%;
        height: 100%;
        aspect-ratio: 3 / 4;
        object-fit: cover;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: none;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
        font-size: 1.05rem;
        padding: 16px 40px;
        border-radius: 999px;
        background: var(--brand);
        color: #fff;
        box-shadow: 0 8px 20px rgba(74, 124, 89, 0.28);
        transition: transform 0.15s ease, background 0.2s ease;
      }
      .btn:hover {
        background: var(--brand-dark);
        transform: translateY(-2px);
      }
      .back {
        display: block;
        margin-top: 28px;
        color: var(--ink-soft);
        font-size: 0.95rem;
      }
      .back:hover { color: var(--brand-dark); }

      @media (max-width: 560px) {
        .gallery { grid-template-columns: 1fr; max-width: 360px; }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="inner">
        <a class="brand" href="/"><span class="dot"></span> Vermazing Soaps</a>
      </div>
    </header>

    <main class="wrap">
      <p class="eyebrow">Gift ready</p>
      <h1>Vermazing Vegan Soap Gift Box</h1>
      <p class="price">CA$25.00</p>

      <div class="gallery">
        <figure>
          <img
            src="/images/gift-box-wrapped.jpg"
            alt="Vermazing vegan soap gift box, wrapped in patterned paper with a grey bow"
            loading="eager"
            decoding="async"
          />
        </figure>
        <figure>
          <img
            src="/images/gift-box-open.jpg"
            alt="Open gift box showing six cream vegan soaps shaped as roses and hearts on green tissue"
            loading="eager"
            decoding="async"
          />
        </figure>
      </div>

      <a class="btn" href="/#contact">For Delivery</a>
      <a class="back" href="/">← Back to home</a>
    </main>
  </body>
</html>
